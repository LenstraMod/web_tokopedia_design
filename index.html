<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page |Tokopedia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <nav>
        <div class="left-side">
            <img src="./Tokopedia-logo.png" alt="Tokopedia Logo">
            <p>Kategori</p>
            <div class="search">
                <span class="material-symbols-outlined">search</span>
                <input type="text" placeholder="Cari di Tokopedia">
            </div>
            <div class="more-nav">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span class="material-symbols-outlined">notifications</span>
                <span class="material-symbols-outlined">mail</span>
            </div>
        </div>
        <div class="right-side">
            <div class="shop-section">
                <span class="symbol_border material-symbols-outlined">storefront</span>
                <p class="section-title">Toko</p>
            </div>
            <div class="profile-section">
                <span class="symbol_border material-symbols-outlined">person</span>
                <p class="section-title">Profil</p>
            </div>
        </div>     
    </nav>
    <main>
        <div class="carousel">
            <div class="carousel-track">
                <div class="banner">
                    <img src="img1marquee.jpg" alt="Promo 1">
                </div>
                <div class="banner">
                    <img src="img2marquee.jpg" alt="Promo 2">
                </div>
                <div class="banner">
                    <img src="img3marquee.jpg" alt="Promo 3">
                </div>
                </div>
            <button class="prev">‹</button>
            <button class="next">›</button>
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
        <div class="container-main">
            <section class="category">
                <h2>Kategori Populer</h2>
                <img src="Tokopedia-banner.png" class="banner-category">
            </section>
            <section>
                <h2>Top up & Tagihan</h2>
            </section>
        </div>
    </main>
</body>
</html>
