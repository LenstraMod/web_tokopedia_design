<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page |Tokopedia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" /
</head>
<body>
    <nav>
        <div class="left-side">
            <img src="./Tokopedia-logo.png" alt="Tokopedia Logo">
            <p>Kategori</p>
            <div class="search">
                <span class="material-symbols-outlined">search</span>
                <input type="text" placeholder="Cari di Tokopedia">
            </div>
            <div class="more-nav">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span class="material-symbols-outlined">notifications</span>
                <span class="material-symbols-outlined">mail</span>
            </div>
        </div>
        <div class="right-side">
            <div class="shop-section">
                <span class="symbol_border material-symbols-outlined">storefront</span>
                <p class="section-title">Toko</p>
            </div>
            <div class="profile-section">
                <span class="symbol_border material-symbols-outlined">person</span>
                <p class="section-title">Profil</p>
            </div>
        </div>     
    </nav>
</body>
</html>
